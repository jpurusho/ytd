name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npx vitest run tests/app.test.ts

  integration-tests:
    runs-on: macos-latest
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download binaries
        run: |
          mkdir -p bin/mac
          # yt-dlp
          curl -L --fail "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_macos" -o bin/mac/yt-dlp
          chmod +x bin/mac/yt-dlp
          bin/mac/yt-dlp --version
          # ffmpeg + ffprobe
          curl -L --fail "https://www.osxexperts.net/ffmpeg7arm.zip" -o /tmp/ffmpeg.zip
          unzip -o /tmp/ffmpeg.zip -d bin/mac/
          rm /tmp/ffmpeg.zip
          curl -L --fail "https://www.osxexperts.net/ffprobe7arm.zip" -o /tmp/ffprobe.zip
          unzip -o /tmp/ffprobe.zip -d bin/mac/
          rm /tmp/ffprobe.zip
          chmod +x bin/mac/ffmpeg bin/mac/ffprobe
          # quickjs
          brew install quickjs
          cp "$(realpath /opt/homebrew/bin/qjs)" bin/mac/qjs
          chmod +x bin/mac/qjs
          # Verify
          file bin/mac/*
          ls -la bin/mac/

      - name: Build app
        run: npm run build
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}

      - name: Package app
        run: npx electron-builder build --mac --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify packaged app binaries
        run: |
          # Extract the packaged app
          APP_ZIP=$(ls release/*.zip | head -1)
          echo "Extracting $APP_ZIP..."
          unzip -q "$APP_ZIP" -d /tmp/ytd-test-app

          APP_PATH=$(find /tmp/ytd-test-app -name "ytd.app" -type d | head -1)
          RESOURCES="$APP_PATH/Contents/Resources/bin"

          echo "=== Bundled binaries in packaged app ==="
          ls -la "$RESOURCES/"
          file "$RESOURCES"/*

          # Verify each binary runs from packaged location
          echo "--- yt-dlp ---"
          "$RESOURCES/yt-dlp" --version
          echo "--- ffmpeg ---"
          "$RESOURCES/ffmpeg" -version | head -1
          echo "--- ffprobe ---"
          "$RESOURCES/ffprobe" -version | head -1
          echo "--- qjs ---"
          "$RESOURCES/qjs" --help 2>&1 | head -1 || true

          # Verify architecture
          echo "--- Architecture check ---"
          for bin in "$RESOURCES"/*; do
            arch=$(file "$bin" | grep -o 'arm64\|x86_64\|universal' || echo 'unknown')
            echo "  $(basename $bin): $arch"
          done

          # Symlink packaged binaries for test runner
          rm -rf bin/mac
          mkdir -p bin/mac
          for f in "$RESOURCES"/*; do
            ln -sf "$f" "bin/mac/$(basename $f)"
          done

      - name: Run integration tests
        run: npx vitest run tests/download.test.ts
        timeout-minutes: 5
