name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - name: Run tests
        run: npm test

      - name: Download yt-dlp and ffmpeg binaries
        run: |
          mkdir -p bin/mac
          # yt-dlp (universal macOS binary — works on both arm64 and x64)
          curl -L --fail "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_macos" -o bin/mac/yt-dlp
          chmod +x bin/mac/yt-dlp
          # ffmpeg + ffprobe: static arm64 builds from osxexperts.net
          # These link only to system frameworks (libc++, VideoToolbox, etc.)
          # No Homebrew or Rosetta needed.
          curl -L --fail "https://www.osxexperts.net/ffmpeg7arm.zip" -o /tmp/ffmpeg.zip
          unzip -o /tmp/ffmpeg.zip -d bin/mac/
          rm /tmp/ffmpeg.zip
          curl -L --fail "https://www.osxexperts.net/ffprobe7arm.zip" -o /tmp/ffprobe.zip
          unzip -o /tmp/ffprobe.zip -d bin/mac/
          rm /tmp/ffprobe.zip
          chmod +x bin/mac/ffmpeg bin/mac/ffprobe
          # Verify arm64 architecture
          file bin/mac/ffmpeg bin/mac/ffprobe bin/mac/yt-dlp
          bin/mac/yt-dlp --version
          ls -la bin/mac/

      - name: Build application
        run: npm run build
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}

      - name: Package for macOS
        run: npx electron-builder build --mac --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ytd-mac
          path: |
            release/*.zip
            release/*.yml
            release/*.blockmap
          retention-days: 7

      - name: Purge old releases (keep last 2)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: dev-drprasad/delete-older-releases@v0.3.4
        with:
          keep_latest: 2
          delete_tags: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: true
          body: |
            ## ytd ${{ github.ref_name }}

            ### macOS Install
            1. Download the `.zip` file below
            2. Extract it (double-click)
            3. Move `ytd.app` to `/Applications`
            4. Run once: `xattr -rc /Applications/ytd.app`
            5. Open ytd and sign in with your Google account

            ### Auto-Update
            If you have a previous version installed, the app will auto-update to this release.
          files: |
            release/*.zip
            release/*.yml
            release/*.blockmap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
