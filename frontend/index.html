<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://i.ytimg.com https://yt3.ggpht.com https://*.googleusercontent.com; media-src 'self' local-media:; frame-src https://www.youtube.com https://www.youtube-nocookie.com; connect-src 'self' https://www.googleapis.com https://youtube.googleapis.com https://oauth2.googleapis.com" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <title>ytd</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; background: #0f0f23; overflow: hidden; }
    #root { height: 100vh; }
    /* macOS draggable titlebar region */
    .titlebar-drag { -webkit-app-region: drag; height: 52px; position: fixed; top: 0; left: 0; right: 0; z-index: 9999; }
    .titlebar-drag button, .titlebar-drag input, .titlebar-drag a { -webkit-app-region: no-drag; }
  </style>
</head>
<body>
  <div class="titlebar-drag"></div>
  <div id="root"></div>
  <script type="module" src="./main.tsx"></script>
</body>
</html>
